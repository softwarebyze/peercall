name: PeerCall
options:
  bundleIdPrefix: com.softwarebyze
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 150.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  PeerCall:
    type: application
    platform: iOS
    sources:
      - path: PeerCall
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softwarebyze.peercall
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: PeerCall/Info.plist
      properties:
        CFBundleDisplayName: PeerCall
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: PeerCall uses your camera for video calls.
        NSMicrophoneUsageDescription: PeerCall uses your microphone for audio in your calls.
        NSLocalNetworkUsageDescription: PeerCall connects directly to the devices of the other people in your call to transmit video and audio.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PeerCall/PeerCall.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.softwarebyze.peercall
  PeerCallScreenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PeerCallScreenShare
      - path: Shared
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softwarebyze.peercall.screenshare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: PeerCallScreenShare/Info.plist
      properties:
        CFBundleDisplayName: PeerCall Screen Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenShareHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: PeerCallScreenShare/PeerCallScreenShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.softwarebyze.peercall
schemes:
  PeerCall:
    build:
      targets:
        PeerCall: all
        PeerCallScreenShare: all
    run:
      config: Debug
