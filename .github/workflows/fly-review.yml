name: Deploy Review App

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Requires FLY_API_TOKEN secret — create an org-scoped token:
#   fly tokens create org --name "github-actions-pr-reviews"
# Do NOT use `fly auth token` (the all-powerful auth token).
#
# Optional REVIEW_APP_ADMIN_TOKEN (Administration: write) lets the cleanup step
# delete the pr-<n> environment on close. Without it the delete is best-effort.
#
# A job-level `if` cannot read `secrets`, so the `preflight` job decides whether
# the token is configured and the deploy job gates on its output. This matters:
# a job that declares `environment:` creates a GitHub Deployment even when every
# step is skipped, which left the PR showing a pr-<n> "deployment" with no link.
# Gating the whole job means no token => no phantom deployment, no dead link.
permissions:
  contents: read
  deployments: write
  # To post the review-app link as a PR comment (upserted in place).
  pull-requests: write

env:
  FLY_REGION: iad
  FLY_ORG: personal

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.fly-token.outputs.set }}
    steps:
      - name: Check for a Fly token
        id: fly-token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not configured; skipping review app deploy."
          fi

  review_app:
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR app to Fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.5.0
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The environment `url` above powers the Deployments "View deployment"
      # button; this comment makes the link obvious on the PR itself. It is
      # upserted via a hidden marker so re-pushes update one comment instead of
      # piling up a new one each time.
      - name: Comment the review app URL on the PR
        if: ${{ github.event.action != 'closed' && steps.deploy.outputs.url != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -eu
          marker='<!-- review-app-url -->'
          body="$marker"$'\n'"Review app deployed: $URL"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- review-app-url -->"))) | .id' \
            | head -n 1 || true)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      - name: Clean up GitHub environment
        # Best-effort: deleting a GitHub environment needs repository
        # Administration write, which GITHUB_TOKEN cannot be granted. Supply a
        # scoped token via REVIEW_APP_ADMIN_TOKEN to actually remove it;
        # otherwise the delete is skipped/ignored so it can never red-X a
        # closed PR.
        if: ${{ always() && github.event.action == 'closed' }}
        continue-on-error: true
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.REVIEW_APP_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          environment: pr-${{ github.event.number }}
