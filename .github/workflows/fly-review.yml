name: Deploy Review App

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Requires FLY_API_TOKEN secret — create an org-scoped token:
#   fly tokens create org --name "github-actions-pr-reviews"
# Do NOT use `fly auth token` (the all-powerful auth token).
#
# Optional REVIEW_APP_ADMIN_TOKEN (Administration: write) lets the cleanup step
# delete the pr-<n> environment on close. Without it the delete is best-effort.
#
# `secrets` is not a valid context in a job-level `if`, so the token check
# happens in a step that exports an output the later steps gate on.
permissions:
  contents: read
  deployments: write

env:
  FLY_REGION: iad
  FLY_ORG: personal

jobs:
  review_app:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check for a Fly token
        id: fly-token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not configured; skipping review app deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.fly-token.outputs.set == 'true'

      - name: Deploy PR app to Fly.io
        id: deploy
        if: steps.fly-token.outputs.set == 'true'
        uses: superfly/fly-pr-review-apps@1.5.0
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Clean up GitHub environment
        # Only relevant when we actually deployed, and best-effort: deleting a
        # GitHub environment needs repository Administration write, which
        # GITHUB_TOKEN cannot be granted. Supply a scoped token via the
        # REVIEW_APP_ADMIN_TOKEN secret to actually remove the environment;
        # otherwise the delete is skipped/ignored so it can never red-X a
        # closed PR.
        if: ${{ always() && github.event.action == 'closed' && steps.fly-token.outputs.set == 'true' }}
        continue-on-error: true
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.REVIEW_APP_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          environment: pr-${{ github.event.number }}
