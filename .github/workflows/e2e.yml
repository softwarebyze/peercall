name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Stamp
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA="${GITHUB_SHA:0:7}"
          echo "stamp=${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "E2E_STAMP=${DATE}-${SHA}" >> "$GITHUB_ENV"

      - name: Run e2e
        run: bun run e2e
        env:
          E2E_STAMP: ${{ steps.meta.outputs.stamp }}

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peercall-e2e-${{ steps.meta.outputs.stamp }}
          path: |
            e2e/recordings
            playwright-report
          retention-days: 90
          if-no-files-found: warn
